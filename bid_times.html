<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid Times</title>
    <script src="BID_CONFIG.js"></script>
    <script src="bid_year_integration.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .info-banner {
            background: #f7fafc;
            padding: 20px;
            border-bottom: 2px solid #e2e8f0;
            text-align: center;
            color: #4a5568;
            font-size: 1.1em;
        }

        .info-banner strong {
            color: #2d3748;
        }

        .content {
            padding: 30px;
        }

        .section-header {
            background: #667eea;
            color: white;
            padding: 15px 20px;
            font-size: 1.3em;
            font-weight: 700;
            border-radius: 8px 8px 0 0;
            margin-top: 30px;
        }

        .section-header:first-child {
            margin-top: 0;
        }

        .table-container {
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }

        .bid-table-header {
            display: grid;
            grid-template-columns: 80px 1fr 180px;
            gap: 20px;
            padding: 15px 20px;
            background: #edf2f7;
            font-weight: 700;
            color: #2d3748;
            border-bottom: 2px solid #cbd5e0;
        }

        .bid-table-row {
            display: grid;
            grid-template-columns: 80px 1fr 180px;
            gap: 20px;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }

        .bid-table-row:hover {
            background: #f7fafc;
        }

        .bid-table-row:last-child {
            border-bottom: none;
        }

        .nbr {
            text-align: center;
            color: #667eea;
            font-weight: 700;
            font-size: 1.1em;
        }

        .name {
            font-weight: 600;
            color: #2d3748;
            font-family: 'Courier New', monospace;
        }

        .bid-time {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: #c53030;
            text-align: center;
            font-size: 1.05em;
        }

        @media (max-width: 768px) {
            .bid-table-header,
            .bid-table-row {
                grid-template-columns: 60px 1fr 140px;
                gap: 15px;
                padding: 12px 15px;
                font-size: 0.9em;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .section-header {
                font-size: 1.1em;
            }
        }
        /* Hide everything until JS loads */
        .page-content { display: none; }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            color: white;
        }
        .loading-overlay .spinner {
            font-size: 48px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner">⏳</div>
        <div>Loading bid times...</div>
    </div>

    <div class="page-content" id="pageContent">
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">⏰ Bid Times</h1>
            <p id="pageSubtitle">Loading...</p>
        </div>

        <div class="info-banner" id="infoBanner">
            Loading bid schedule...
        </div>

        <div class="content" id="mainContent">
            <div id="loadingIndicator" style="text-align: center; padding: 60px; color: #667eea;">
                <div style="font-size: 48px; margin-bottom: 20px;">⏳</div>
                <div style="font-size: 18px;">Loading bid times...</div>
            </div>

            <div id="dataContent" style="display: none;">
                <!-- SSOM Lines -->
                <div class="section-header" id="ssomHeader">
                    👔 SSOM Lines (Senior System Operations Manager)
                </div>
                <div class="table-container" id="ssomContainer">
                    <div class="bid-table-header">
                        <div>NBR</div>
                        <div>Name</div>
                        <div>Bid Time</div>
                    </div>
                </div>

                <!-- SOM Lines -->
                <div class="section-header" id="somHeader">
                    👤 SOM Lines (System Operations Manager)
                </div>
                <div class="table-container" id="somContainer">
                    <div class="bid-table-header">
                        <div>NBR</div>
                        <div>Name</div>
                        <div>Bid Time</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div><!-- end page-content -->

    <script>
        // Personnel data - loaded dynamically from Firebase
        var SSOM_PERSONNEL = [];
        var SOM_PERSONNEL = [];

        // Load seniority from Firebase
        async function loadSeniorityLists() {
            // Fetch active bid year first
            try {
                await BID_CONFIG.fetchActiveBidYear();
            } catch (err) {
                console.log('Could not fetch active year, using fallback');
            }
            BID_CONFIG.init(false);

            // Use dynamic seniority path based on bid year
            var baseUrl = BID_CONFIG.getFirebaseUrl();
            var seniorityPath = (typeof BidYearIntegration !== 'undefined')
                ? BidYearIntegration.getSeniorityPath()
                : '/seniority.json';

            console.log('Loading seniority from: ' + seniorityPath);

            try {
                var response = await fetch(baseUrl + seniorityPath);
                if (response.ok) {
                    var data = await response.json();
                    if (data && data.GROUP1 && data.GROUP1.length > 0) {
                        SSOM_PERSONNEL = data.GROUP1.map(function(p) { return p.name; });
                        SOM_PERSONNEL = (data.GROUP2 || []).map(function(p) { return p.name; });
                        console.log('Loaded seniority: SSOM=' + SSOM_PERSONNEL.length + ', SOM=' + SOM_PERSONNEL.length);
                        return true;
                    }
                }
            } catch (err) {
                console.error('Failed to load seniority:', err);
            }
            console.warn('No seniority data found - page will be empty');
            return false;
        }

        function getBidStartDate() {
            var bidYear = typeof BID_CONFIG !== 'undefined' ? BID_CONFIG.getBidYear() : 2026;
            return new Date(bidYear, 0, 6, 5, 0, 0);
        }

        function formatBidTime(date) {
            var hours = date.getHours().toString().padStart(2, '0');
            var minutes = date.getMinutes().toString().padStart(2, '0');
            var day = date.getDate().toString().padStart(2, '0');
            var monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                              'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            var month = monthNames[date.getMonth()];
            var year = (date.getFullYear() % 100).toString().padStart(2, '0');
            return hours + ':' + minutes + ' ' + day + month + year;
        }

        function formatLongDate(date) {
            var monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                              'July', 'August', 'September', 'October', 'November', 'December'];
            return monthNames[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear();
        }

        function generateBidRows(container, personnel, startTime) {
            var header = container.querySelector('.bid-table-header');
            container.innerHTML = '';
            container.appendChild(header);

            var currentTime = new Date(startTime.getTime());

            personnel.forEach(function(name, index) {
                var row = document.createElement('div');
                row.className = 'bid-table-row';
                row.innerHTML =
                    '<div class="nbr">' + (index + 1) + '</div>' +
                    '<div class="name">' + name + '</div>' +
                    '<div class="bid-time">' + formatBidTime(currentTime) + '</div>';
                container.appendChild(row);
                currentTime = new Date(currentTime.getTime() + 10 * 60 * 1000);
            });

            return currentTime;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            // Load seniority from Firebase first
            var loaded = await loadSeniorityLists();

            var bidYear = BID_CONFIG.getBidYear();
            var bidStartDate = getBidStartDate();

            // Update page title and headers with correct bid year
            document.title = bidYear + '-' + (bidYear + 1) + ' Bid Times';
            document.getElementById('pageTitle').textContent = '⏰ Bid Times - ' + bidYear + '-' + (bidYear + 1);
            document.getElementById('pageSubtitle').textContent = 'Seniority Order | Bidding Schedule | April 1, ' + bidYear + ' - March 31, ' + (bidYear + 1);

            // Hide page loading overlay, show page content
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('pageContent').style.display = 'block';

            // Hide data loading indicator, show data content
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('dataContent').style.display = 'block';

            if (!loaded || SSOM_PERSONNEL.length === 0) {
                document.getElementById('dataContent').innerHTML =
                    '<div style="text-align:center;padding:40px;color:#e53e3e;">' +
                    '<div style="font-size:48px;margin-bottom:20px;">⚠️</div>' +
                    '<div style="font-size:18px;">No seniority data found for this bid year.</div>' +
                    '<div style="font-size:14px;margin-top:10px;color:#718096;">Please set up seniority via the Seniority Compiler.</div>' +
                    '</div>';
                return;
            }

            var totalPeople = SSOM_PERSONNEL.length + SOM_PERSONNEL.length;
            document.getElementById('infoBanner').innerHTML = '<strong>Bidding starts:</strong> ' + formatLongDate(bidStartDate) +
                ' at 05:00 | <strong>Interval:</strong> 10 minutes per person | <strong>Total:</strong> ' +
                totalPeople + ' people';

            document.getElementById('ssomHeader').textContent = '👔 SSOM Lines (Senior System Operations Manager) - ' + SSOM_PERSONNEL.length + ' Lines';
            document.getElementById('somHeader').textContent = '👤 SOM Lines (System Operations Manager) - ' + SOM_PERSONNEL.length + ' Lines';

            var ssomContainer = document.getElementById('ssomContainer');
            generateBidRows(ssomContainer, SSOM_PERSONNEL, bidStartDate);

            var somContainer = document.getElementById('somContainer');
            generateBidRows(somContainer, SOM_PERSONNEL, bidStartDate);
        });
    </script>
</body>
</html>
